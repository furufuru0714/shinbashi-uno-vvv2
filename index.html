<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スロット勝台予測ツール - 新橋UNO ヴァルヴレイヴ2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ヘッダー */
        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        /* メインコンテンツ */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        /* カード共通スタイル */
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        /* 収支カード */
        .balance-card {
            text-align: center;
            grid-column: span 1;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            border-radius: 8px;
            background: #f0f4ff;
        }

        .balance-amount.positive {
            color: #2ecc71;
        }

        .balance-amount.negative {
            color: #e74c3c;
        }

        /* 推奨台カード */
        .recommend-card {
            grid-column: span auto;
        }

        .machine-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 6px;
        }

        .machine-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .machine-probability {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        /* イベント情報カード */
        .event-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            grid-column: span 1;
        }

        .event-card h2 {
            color: white;
            border-bottom-color: rgba(255, 255, 255, 0.3);
        }

        .event-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-size: 15px;
        }

        /* ナビゲーション */
        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .nav-button {
            background: white;
            border: none;
            padding: 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            color: #333;
        }

        .nav-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 12px 48px rgba(102, 126, 234, 0.4);
        }

        /* フッター */
        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 14px;
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .main-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .card {
                padding: 20px;
            }

            .balance-amount {
                font-size: 28px;
            }

            .machine-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .machine-probability {
                margin-top: 10px;
            }

            .nav-buttons {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header {
                padding: 15px;
            }

            .card {
                padding: 15px;
            }

            .card h2 {
                font-size: 16px;
            }

            .balance-amount {
                font-size: 24px;
            }

            .machine-name {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>🎰 スロット勝台予測ツール</h1>
            <p>新橋UNO - Lパチスロ 革命機ヴァルヴレイヴ2</p>
        </div>

        <!-- 収支情報 -->
        <div class="main-grid">
            <div class="card balance-card">
                <h2>📊 現在の収支</h2>
                <div class="balance-amount positive" id="balanceAmount">
                    +¥125,500
                </div>
                <p style="color: #666; font-size: 14px;">
                    前回訪問時からの合計収支
                </p>
            </div>

            <!-- 推奨台情報 -->
            <div class="card recommend-card">
                <h2>⭐ 本日のおすすめ台</h2>
                <div class="machine-item">
                    <span class="machine-name">0503番台</span>
                    <span class="machine-probability">85%</span>
                </div>
                <div class="machine-item">
                    <span class="machine-name">0507番台</span>
                    <span class="machine-probability">78%</span>
                </div>
                <div class="machine-item">
                    <span class="machine-name">0501番台</span>
                    <span class="machine-probability">72%</span>
                </div>
            </div>

            <!-- イベント情報 -->
            <div class="card event-card">
                <h2>📢 イベント・おすすめ訪問日</h2>
                <div class="event-item">
                    🎯 <strong>明日8月29日</strong><br>
                    設定変更日（高期待値）
                </div>
                <div class="event-item">
                    📅 <strong>9月1日（月）</strong><br>
                    スペシャルイベント開催
                </div>
            </div>
        </div>

        <!-- ナビゲーション -->
        <div class="nav-buttons">
            <a href="input.html" class="nav-button">
                📝 データ入力ページへ
            </a>
            <a href="#analytics" class="nav-button">
                📈 詳細分析を見る
            </a>
            <a href="#history" class="nav-button">
                📋 訪問履歴
            </a>
            <a href="#settings" class="nav-button">
                ⚙️ 設定
            </a>
        </div>

        <!-- フッター -->
        <div class="footer">
            <p>© 2026 スロット勝台予測ツール | 新橋UNO専用</p>
        </div>
    </div>

    <script>
        // ここに後からJavaScriptロジックを追加
        document.addEventListener('DOMContentLoaded', function() {
            console.log('ダッシュボード読み込み完了');
        });
    </script>
</body>
</html>
